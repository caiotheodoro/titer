[project]
name = "titer"
version = "0.0.0"
description = "Measuring how often people-search indexes confidently name the wrong human, and what it is worth paying to find out."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
corpus = ["httpx", "polars", "pyarrow"]
metrics = ["numpy", "scipy", "scikit-learn", "lifelines"]
adapters = ["httpx", "tenacity"]
env = ["gymnasium"]
train = ["torch", "transformers", "peft", "trl", "bitsandbytes"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
