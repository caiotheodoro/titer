[project]
name = "titer"
version = "0.0.0"
description = "Measuring how often people-search indexes confidently name the wrong human, and what it is worth paying to find out."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
corpus = ["httpx", "polars", "pyarrow"]
metrics = ["numpy", "scipy", "scikit-learn", "lifelines"]
adapters = ["httpx", "tenacity"]
env = ["gymnasium"]
train = ["torch", "transformers", "peft", "trl", "bitsandbytes"]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
